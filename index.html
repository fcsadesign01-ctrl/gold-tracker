<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gold AED">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dubai Gold</title>
<style>
:root{--bg:#f5f1e8;--ink:#2a2418;--mute:#7a705c;--line:#d9d0b8;--up:#2f6b3a;--down:#a23b2a;--gold:#b8860b}
@media(prefers-color-scheme:dark){:root{--bg:#14110b;--ink:#f1e9d2;--mute:#9a8f75;--line:#2e2819;--up:#7ec48a;--down:#e3806e;--gold:#e0b23c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif;
padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 28px);max-width:480px;margin-inline:auto}
h1{font-size:15px;font-weight:normal;color:var(--mute);margin:0 0 6px}
.price{font-size:64px;line-height:1;letter-spacing:-1px;color:var(--gold)}
.price small{font-size:18px;color:var(--mute);letter-spacing:0;margin-left:6px}
.chg{margin:10px 0 28px;font-size:16px}
.up{color:var(--up)}.down{color:var(--down)}
svg{width:100%;height:90px;display:block;margin-bottom:28px}
table{width:100%;border-collapse:collapse;font-size:18px}
td{padding:12px 0;border-top:1px solid var(--line)}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
p{color:var(--mute);font-size:13px;line-height:1.5;margin-top:24px}
</style>
</head>
<body>
<h1 id="when">Loading…</h1>
<div class="price"><span id="p">–</span><small>AED / gram, 24K</small></div>
<div class="chg" id="c"></div>
<svg id="spark" viewBox="0 0 300 90" preserveAspectRatio="none"></svg>
<table id="t"></table>
<p>Spot-based estimate. Dubai jewellery shops add making charges and a margin, so shop prices run higher.</p>
<script>
const f=n=>n.toLocaleString("en",{minimumFractionDigits:2,maximumFractionDigits:2});
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
  if(!d.length){document.getElementById("when").textContent="No data yet. Run the workflow once.";return}
  const l=d.at(-1),p=d.at(-2);
  document.getElementById("when").textContent="Dubai gold, "+new Date(l.date).toLocaleDateString("en",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("p").textContent=f(l.k24);
  if(p){const x=l.k24-p.k24,pc=x/p.k24*100;
    document.getElementById("c").innerHTML=`<span class="${x>=0?"up":"down"}">${x>=0?"▲":"▼"} ${f(Math.abs(x))} (${pc.toFixed(2)}%)</span> since ${p.date}`}
  document.getElementById("t").innerHTML=[["22K","k22"],["21K","k21"],["18K","k18"]].map(([n,k])=>`<tr><td>${n}</td><td>${f(l[k])}</td></tr>`).join("");
  const v=d.slice(-30).map(e=>e.k24);
  if(v.length>1){const mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
    const pts=v.map((y,i)=>`${i/(v.length-1)*300},${80-(y-mn)/r*70}`).join(" ");
    document.getElementById("spark").innerHTML=`<polyline points="${pts}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke"/>`}
}).catch(()=>document.getElementById("when").textContent="Couldn't load data.json");
</script>
</body>
</html>
