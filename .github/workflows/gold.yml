name: Update gold rates
on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 09:00 Dubai
  workflow_dispatch:       # lets you run it manually
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python fetch_gold.py
      - name: Commit changes
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update gold rates" && git push
