name: ETF prices

on:
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-prices

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch prices
        run: python fetch_etf.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update ETF prices"
          git pull --rebase
          git push
